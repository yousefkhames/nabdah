<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nabdah | نبضة: خريطة التغطية بتاعة الناس</title><meta name="description" content="Crowdsourced network coverage map for emergencies and hiking. Find signal, log dead zones, record trails offline.">
<link rel="icon" href="favicon.svg"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body>
<header><img src="logo.svg" alt=""><h1 id="t_title">نبضة<small id="t_sub"></small></h1><button class="btn alt sm" id="lang">EN</button></header>
<nav id="nav"><button data-s="map" class="on"></button><button data-s="report"></button><button data-s="sos"></button><button data-s="hike"></button></nav>
<main>
<section id="map_s" class="on"><div id="map"></div>
<div class="bar"><select class="chip" id="carrier"></select><span class="chip" id="here"></span></div>
<div class="legend" id="legend"></div></section>
<section id="report_s"><div class="page"><div class="card"><h2 id="r_h"></h2>
<label id="r_bars"></label><div class="bars" id="bars"></div>
<div class="row"><div><label id="r_car"></label><select id="r_carrier"></select></div><div><label id="r_net"></label><select id="r_nettype"></select></div></div>
<div class="row"><div><label id="r_where"></label><select id="r_out"></select></div></div>
<p class="mut" id="r_pos"></p><button class="btn" id="send" style="width:100%"></button><p class="note" id="r_priv"></p></div></div></section>
<section id="sos_s"><div class="page"><div class="card"><h2 id="s_h"></h2><div id="s_now" class="mut"></div></div>
<div class="card"><h2 id="s_near"></h2><div class="row" style="flex-wrap:nowrap"><svg class="arrow" id="arrow" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#24594f" stroke-width="4"/><path d="M50 12 72 70 50 58 28 70Z" fill="#2ee6a6"/></svg><div style="flex:3"><div class="big" id="s_dist">--</div><div class="mut" id="s_dir"></div></div></div><button class="btn alt" id="s_go" style="margin-top:10px;width:100%"></button></div>
<div class="card"><h2 id="s_msg_h"></h2><pre id="s_msg"></pre><div class="row"><button class="btn" id="s_copy"></button><a class="btn alt" id="s_sms" style="text-align:center;text-decoration:none"></a></div><p class="note" id="s_note"></p></div>
<div class="card sos"><h2 id="s_num"></h2><a href="tel:112">112</a><a href="tel:122">122 (Police / شرطة)</a><a href="tel:123">123 (Ambulance / إسعاف)</a></div></div></section>
<section id="hike_s"><div class="page"><div class="card"><h2 id="h_h"></h2><p class="mut" id="h_p"></p>
<div class="big" id="h_stat">0</div><div class="mut" id="h_sub"></div>
<div class="row" style="margin-top:10px"><button class="btn" id="h_start"></button><button class="btn alt" id="h_dl"></button></div>
<label id="h_cur"></label><div class="bars" id="h_bars"></div><p class="note" id="h_note"></p></div>
<div class="card"><h2 id="h_tips"></h2><div id="h_tiplist" class="mut"></div></div></div></section>
</main><div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="core.js"></script><script src="app.js"></script></body></html>
