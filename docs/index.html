<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1f1c">
<title>نبضة | Nabdah: خريطة تغطية الشبكة من الناس</title><meta name="description" content="Crowdsourced network coverage map for emergencies and hiking. Find signal, log dead zones, record trails offline.">
<meta property="og:title" content="Nabdah | نبضة"><meta property="og:description" content="Crowdsourced coverage map for emergencies and hiking. خريطة تغطية الشبكة من الناس."><meta property="og:image" content="icon-512.png"><meta name="color-scheme" content="dark"><link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body><a class="skip" href="#main" id="skip">تخطي للمحتوى</a>
<header><img src="logo.svg" alt=""><h1 id="t_title">نبضة<small id="t_sub"></small></h1><button class="btn alt sm" id="lang">EN</button></header>
<main id="main" tabindex="-1">
<section id="map_s" role="tabpanel" aria-labelledby="tab_map" class="on"><div id="map" role="region" aria-label="Coverage map"></div>
<div class="bar"><select class="chip" id="carrier" aria-label="Carrier"></select><button class="chip" id="here" type="button"></button><button class="chip" id="dead" type="button" aria-pressed="false"></button><span class="chip" id="summary" role="status" aria-live="polite"></span></div><form class="search" id="q_form" role="search"><input type="search" id="q" autocomplete="off"><button class="btn sm" id="q_go" type="submit"></button></form>
<button class="fab" id="fab" type="button" aria-label="Locate me"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5" stroke="currentColor" stroke-width="2"/></svg></button><div class="legend" id="legend"></div></section>
<section id="report_s" role="tabpanel" aria-labelledby="tab_report"><div class="page"><div class="card"><h2 id="r_h"></h2>
<label id="r_bars" for="bars"></label><div class="bars" id="bars" role="radiogroup" aria-labelledby="r_bars"></div>
<div class="row"><div><label id="r_car" for="r_carrier"></label><select id="r_carrier"></select></div><div><label id="r_net" for="r_nettype"></label><select id="r_nettype"></select></div></div>
<div class="row"><div><label id="r_where" for="r_out"></label><select id="r_out"></select></div></div>
<p class="mut" id="r_pos"></p><button class="btn" id="send" style="width:100%"></button><p class="note" id="r_priv"></p></div><div class="card"><h2 id="my_h"></h2><ul class="spots" id="my_list"></ul></div></div></section>
<section id="sos_s" role="tabpanel" aria-labelledby="tab_sos"><div class="page"><div id="s_status" class="status" role="status" aria-live="polite"></div><h2 id="s_h" class="sr"></h2><div id="s_now" class="sr"></div>
<div class="card"><h2 id="s_near"></h2><div class="row" style="flex-wrap:nowrap"><svg class="arrow" id="arrow" role="img" aria-label="Direction arrow" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#24594f" stroke-width="4"/><path d="M50 12 72 70 50 58 28 70Z" fill="#2ee6a6"/></svg><div style="flex:3"><div class="big" id="s_dist">--</div><div class="mut" id="s_dir"></div></div></div><button class="btn alt" id="s_go" style="margin-top:10px;width:100%"></button><ul class="spots" id="s_list"></ul></div>
<div class="card"><h2 id="s_msg_h"></h2><pre id="s_msg"></pre><div class="row"><button class="btn" id="s_share"></button><button class="btn" id="s_copy"></button><a class="btn alt" id="s_sms" style="text-align:center;text-decoration:none"></a></div><p class="note" id="s_note"></p></div>
<div class="card sos"><h2 id="s_num"></h2><a href="tel:112">112</a><a href="tel:122">122 (Police / شرطة)</a><a href="tel:123">123 (Ambulance / إسعاف)</a></div></div></section>
<section id="hike_s" role="tabpanel" aria-labelledby="tab_hike"><div class="page"><div class="card"><h2 id="h_h"></h2><p class="mut" id="h_p"></p>
<div class="big" id="h_stat">0</div><div class="mut" id="h_sub"></div>
<div class="row" style="margin-top:10px"><button class="btn" id="h_start"></button><button class="btn alt" id="h_dl"></button></div>
<label id="h_cur"></label><div class="bars" id="h_bars"></div><p class="note" id="h_note"></p></div>
<div class="card"><h2 id="rt_h"></h2><p class="mut" id="rt_p"></p><div class="row"><label for="rt_file" class="btn alt" id="rt_lbl" style="text-align:center;cursor:pointer;margin:0"></label><button class="btn alt" id="rt_trail" type="button"></button></div><input type="file" id="rt_file" accept=".gpx,application/gpx+xml,text/xml" aria-labelledby="rt_lbl" class="sr"><div id="rt_res" role="status" aria-live="polite" style="margin-top:10px"></div><button class="btn sm" id="rt_show" hidden type="button" style="margin-top:8px"></button></div><div class="card"><h2 id="d_h"></h2><p class="mut" id="d_p"></p><div class="row"><button class="btn alt" id="ex_json" type="button"></button><label for="im_file" class="btn alt" id="im_lbl" style="text-align:center;cursor:pointer;margin:0"></label></div><input type="file" id="im_file" accept="application/json,.json" class="sr"><button class="btn warn" id="wipe" type="button" style="margin-top:10px;width:100%"></button></div><div class="card"><h2 id="h_tips"></h2><div id="h_tiplist" class="mut"></div></div></div></section>
</main><nav id="nav" role="tablist" aria-label="Sections"><button role="tab" id="tab_map" data-s="map" class="on" aria-selected="true" aria-controls="map_s"><span class="ic" aria-hidden="true">&#9673;</span><span class="tl"></span></button><button role="tab" id="tab_report" data-s="report" aria-selected="false" aria-controls="report_s"><span class="ic" aria-hidden="true">&#9998;</span><span class="tl"></span></button><button role="tab" id="tab_sos" data-s="sos" aria-selected="false" aria-controls="sos_s"><span class="ic" aria-hidden="true">&#9888;</span><span class="tl"></span></button><button role="tab" id="tab_hike" data-s="hike" aria-selected="false" aria-controls="hike_s"><span class="ic" aria-hidden="true">&#9651;</span><span class="tl"></span></button></nav>
<dialog id="onb" aria-labelledby="onb_h"><h2 id="onb_h"></h2><ol id="onb_l"></ol><p class="note" id="onb_n"></p><button class="btn" id="onb_ok" style="width:100%"></button></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="core.js"></script><script src="app.js"></script></body></html>
